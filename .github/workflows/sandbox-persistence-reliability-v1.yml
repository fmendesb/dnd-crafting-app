name: Sandbox Persistence Reliability v1

on:
  push:
    branches: [sandbox]
    paths:
      - '.github/workflows/sandbox-persistence-reliability-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sandbox

      - name: Patch sandbox app
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('dnd_crafting_app/crafting_app.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              text = text.replace(old, new, 1)

          def replace_all_exact(old, new, expected, label):
              global text
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{label}: expected {expected} matches, found {count}')
              text = text.replace(old, new)

          replace_once(
          '''def sb_save_player_state(pname: str, state: Dict[str, Any]) -> bool:
              if SB is None:
                  return False
              try:
                  SB.table("player_state").upsert({"player_name": pname, "state": state}).execute()
                  return True
              except Exception:
                  return False
          ''',
          '''def sb_save_player_state(pname: str, state: Dict[str, Any]) -> bool:
              if SB is None:
                  return False
              try:
                  SB.table("player_state").upsert({"player_name": pname, "state": state}).execute()
                  return True
              except Exception as exc:
                  st.session_state["_last_save_error"] = str(exc)
                  return False
          ''',
          'save wrapper')

          replace_once(
          '''def save_player_now(pname: str):
              if SB is None:
                  return
              pl = get_player(pname)
              state = {
                  "player": {"skills": pl.get("skills", {}), "known_recipes": pl.get("known_recipes", [])},
                  "inventory": st.session_state.inventories.get(pname, {}),
                  "jobs": st.session_state.jobs.get(pname, []),
                  "activity_log": st.session_state.get("activity_log", {}).get(pname, []),
              }
              sb_save_player_state(pname, state)
          ''',
          '''def save_player_now(pname: str) -> bool:
              if SB is None:
                  st.error("Save unavailable: Supabase is not configured. Your latest change was not persisted.")
                  st.stop()
              pl = get_player(pname)
              state = {
                  "player": {"skills": pl.get("skills", {}), "known_recipes": pl.get("known_recipes", [])},
                  "inventory": st.session_state.inventories.get(pname, {}),
                  "jobs": st.session_state.jobs.get(pname, []),
                  "activity_log": st.session_state.get("activity_log", {}).get(pname, []),
              }
              if not sb_save_player_state(pname, state):
                  st.error(f"Save failed for {pname}. Your latest change may not be persistent. Refresh before continuing.")
                  st.stop()
              st.session_state.pop("_last_save_error", None)
              return True
          ''',
          'save player now')

          replace_once(
          '''                    if st.button("−1 XP", key=f"{pname}-{s}-xpminus"):
                                  push_undo(pname, f"XP −1 ({s})")
                                  apply_xp_delta(get_player(pname), s, -1)
                                  save_player_now(pname)
                                  st.rerun()
          ''',
          '''                    if st.button("−1 XP", key=f"{pname}-{s}-xpminus"):
                                  push_undo(pname, f"XP −1 ({s})")
                                  apply_xp_delta(get_player(pname), s, -1)
                                  add_notice(pname, f"Adjusted {s} XP by −1.", kind="xp")
                                  save_player_now(pname)
                                  st.rerun()
          ''',
          'xp minus log')

          replace_once(
          '''                    if st.button("+1 XP", key=f"{pname}-{s}-xpplus"):
                                  push_undo(pname, f"XP +1 ({s})")
                                  apply_xp_delta(get_player(pname), s, +1)
                                  save_player_now(pname)
                                  st.rerun()
          ''',
          '''                    if st.button("+1 XP", key=f"{pname}-{s}-xpplus"):
                                  push_undo(pname, f"XP +1 ({s})")
                                  apply_xp_delta(get_player(pname), s, +1)
                                  add_notice(pname, f"Adjusted {s} XP by +1.", kind="xp")
                                  save_player_now(pname)
                                  st.rerun()
          ''',
          'xp plus log')

          replace_once(
          '''                            if st.button("−", key=f"{pname}-inv-{nm}-minus"):
                                          push_undo(pname, f"Inventory −1 ({nm})")
                                          remove_item(inv, nm, 1)
                                          save_player_now(pname)
                                          st.rerun()
          ''',
          '''                            if st.button("−", key=f"{pname}-inv-{nm}-minus"):
                                          push_undo(pname, f"Inventory −1 ({nm})")
                                          remove_item(inv, nm, 1)
                                          add_notice(pname, f"Removed 1× {nm} from inventory.", kind="inventory", items=[nm])
                                          save_player_now(pname)
                                          st.rerun()
          ''',
          'inventory minus log')

          replace_once(
          '''                            if st.button("＋", key=f"{pname}-inv-{nm}-plus"):
                                          push_undo(pname, f"Inventory +1 ({nm})")
                                          add_item(inv, nm, 1)
                                          save_player_now(pname)
                                          st.rerun()
          ''',
          '''                            if st.button("＋", key=f"{pname}-inv-{nm}-plus"):
                                          push_undo(pname, f"Inventory +1 ({nm})")
                                          add_item(inv, nm, 1)
                                          add_notice(pname, f"Added 1× {nm} to inventory.", kind="inventory", items=[nm])
                                          save_player_now(pname)
                                          st.rerun()
          ''',
          'inventory plus log')

          replace_all_exact(
          '''                                        save_player_now(pname)
                                                  save_player_now(to_player)
                                                  add_notice(pname, f"Sent {int(send_qty)}× {nm} to {to_player}.", kind="trade", items=[nm])
                                                  add_notice(to_player, f"Received {int(send_qty)}× {nm} from {pname}.", kind="trade", items=[nm])
                                                  st.rerun()
          ''',
          '''                                        add_notice(pname, f"Sent {int(send_qty)}× {nm} to {to_player}.", kind="trade", items=[nm])
                                                  add_notice(to_player, f"Received {int(send_qty)}× {nm} from {pname}.", kind="trade", items=[nm])
                                                  save_player_now(pname)
                                                  save_player_now(to_player)
                                                  st.rerun()
          ''',
          2,
          'trade log ordering')

          replace_once(
          '''                            if st.button("Add to inventory (Gathered)", key=f"{pname}-g-add"):
                                          push_undo(pname, f"Gathered {item_name}")
                                          add_item(inv, item_name, 1)
                                          apply_xp_delta(get_player(pname), gathering_prof, xp_gain)
                                          st.session_state.gather_results.pop(pname, None)
                                          save_player_now(pname)
                                          st.rerun()
          ''',
          '''                            if st.button("Add to inventory (Gathered)", key=f"{pname}-g-add"):
                                          push_undo(pname, f"Gathered {item_name}")
                                          add_item(inv, item_name, 1)
                                          apply_xp_delta(get_player(pname), gathering_prof, xp_gain)
                                          add_notice(pname, f"Gathered {item_name} and gained {xp_gain} {gathering_prof} XP.", kind="gather", items=[item_name])
                                          st.session_state.gather_results.pop(pname, None)
                                          save_player_now(pname)
                                          st.rerun()
          ''',
          'gather log')

          replace_once(
          '''                                st.session_state.vendor_offers[pname] = offer

                                          save_player_now(pname)
                                          st.rerun()
          ''',
          '''                                st.session_state.vendor_offers[pname] = offer

                                          add_notice(pname, f"Bought 1× {nm} from vendor.", kind="vendor", items=[nm])
                                          save_player_now(pname)
                                          st.rerun()
          ''',
          'vendor log')

          replace_once(
          '''                            if roll_total <= 0:
                                          st.error("Please enter your discovery roll total first.")

                                      push_undo(pname, f"Discovery attempt ({craft_prof})")
          ''',
          '''                            if roll_total <= 0:
                                          st.error("Please enter your discovery roll total first.")
                                          st.stop()

                                      push_undo(pname, f"Discovery attempt ({craft_prof})")
          ''',
          'discovery roll validation')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate Python syntax
        run: python -m py_compile dnd_crafting_app/crafting_app.py

      - name: Commit sandbox fixes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add dnd_crafting_app/crafting_app.py
          git diff --staged --quiet || (
            git commit -m "Sandbox: persistence and reliability v1" &&
            git push origin sandbox
          )
